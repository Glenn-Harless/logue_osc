<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minilogue XD Oscillator Preview</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Minilogue XD Oscillator Preview</h1>
        
        <div class="controls">
            <div class="control-group">
                <button id="play" class="btn btn-play">Play</button>
                <button id="stop" class="btn btn-stop" disabled>Stop</button>
            </div>
            
            <div class="control-group">
                <label for="note">Note:</label>
                <select id="note">
                    <option value="48">C3</option>
                    <option value="60" selected>C4</option>
                    <option value="72">C5</option>
                    <option value="84">C6</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="master-volume">Master Volume:</label>
                <input type="range" id="master-volume" min="0" max="100" value="30">
                <span id="master-volume-value">30%</span>
            </div>
        </div>

        <div class="oscillators">
            <section class="osc-card" data-osc="osc1">
                <header>
                    <h2>Oscillator 1</h2>
                    <p class="osc-subtitle">Analog Model</p>
                </header>
                <div class="control-group">
                    <label for="osc1-waveform">Waveform:</label>
                    <select id="osc1-waveform">
                        <option value="sawtooth" selected>Saw</option>
                        <option value="square">Square</option>
                        <option value="triangle">Triangle</option>
                        <option value="sine">Sine</option>
                        <option value="noise">Noise</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="osc1-shape">Shape:</label>
                    <input type="range" id="osc1-shape" min="0" max="1023" value="512">
                    <span id="osc1-shape-value">512</span>
                </div>
                <div class="control-group">
                    <label for="osc1-level">Level:</label>
                    <input type="range" id="osc1-level" min="0" max="100" value="40">
                    <span id="osc1-level-value">40%</span>
                </div>
            </section>

            <section class="osc-card" data-osc="osc2">
                <header>
                    <h2>Oscillator 2</h2>
                    <p class="osc-subtitle">Analog Model</p>
                </header>
                <div class="control-group">
                    <label for="osc2-waveform">Waveform:</label>
                    <select id="osc2-waveform">
                        <option value="triangle" selected>Triangle</option>
                        <option value="sawtooth">Saw</option>
                        <option value="square">Square</option>
                        <option value="sine">Sine</option>
                        <option value="noise">Noise</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="osc2-shape">Shape:</label>
                    <input type="range" id="osc2-shape" min="0" max="1023" value="512">
                    <span id="osc2-shape-value">512</span>
                </div>
                <div class="control-group">
                    <label for="osc2-level">Level:</label>
                    <input type="range" id="osc2-level" min="0" max="100" value="35">
                    <span id="osc2-level-value">35%</span>
                </div>
            </section>

            <section class="osc-card" data-osc="osc3">
                <header>
                    <h2>Oscillator 3</h2>
                    <p class="osc-subtitle">logue SDK User Slot</p>
                </header>
                <div class="control-group">
                    <label for="osc3-select">Oscillator:</label>
                    <select id="osc3-select"></select>
                </div>
                <div class="control-group">
                    <button id="osc3-load" class="btn">Load Selected</button>
                    <span id="osc3-status" class="osc-status">Not Loaded</span>
                </div>
                <div class="control-group">
                    <label for="osc3-level">Level:</label>
                    <input type="range" id="osc3-level" min="0" max="100" value="40">
                    <span id="osc3-level-value">40%</span>
                </div>
                <div class="parameter-grid" id="osc3-parameters"></div>
            </section>
        </div>
        
        <div class="visualizer">
            <canvas id="waveform-display" width="800" height="200"></canvas>
        </div>
        
        <div class="info">
            <p>Status: <span id="status">Ready</span></p>
            <p>Frequency: <span id="frequency">--</span> Hz</p>
        </div>
    </div>
    
    <script src="js/audio-engine.js"></script>
    <script src="js/ui-controls.js"></script>
</body>
</html>
